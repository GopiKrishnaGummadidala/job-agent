name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch cancels the run that is still in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  api:
    name: API tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: jobagent
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d jobagent"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      # Throwaway credentials for the CI-only database above.
      MIGRATE_DATABASE_URL: postgres://postgres:postgres@localhost:5432/jobagent
      APP_DB_PASSWORD: ci_app_password
      DATABASE_URL: postgres://jobagent_app:ci_app_password@localhost:5432/jobagent
      SCHEDULER: 'off'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install Chromium (browser-assist tests)
        run: npx playwright install --with-deps chromium
      - name: Build, migrate and test
        run: npm test

  web:
    name: Web type-check and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Type-check and build
        run: npm run build -w apps/web
